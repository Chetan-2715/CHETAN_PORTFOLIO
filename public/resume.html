<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chetan Shabadi — Resume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #030305;
        color: #ffffff;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 bg-[#030305] text-white">
    <!-- Header Bar -->
    <header class="w-full max-w-6xl mx-auto flex items-center justify-between py-4 px-6 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-xl mb-6 shadow-2xl">
      <!-- Back to Portfolio -->
      <a href="/" class="flex items-center gap-2 text-sm font-mono text-cyan-400 hover:text-cyan-300 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        <span>Back to Portfolio</span>
      </a>

      <!-- Title -->
      <div class="hidden sm:flex items-center gap-2 font-mono text-xs text-white/70 uppercase tracking-widest">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
        Chetan Shabadi — Resume
      </div>

      <!-- Download Button -->
      <a href="/resume.pdf" download="Chetan_Shabadi_Resume.pdf" class="px-5 py-2.5 rounded-full bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-medium text-xs sm:text-sm flex items-center gap-2 hover:opacity-90 transition-all shadow-[0_0_20px_rgba(34,211,238,0.4)]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
        <span>Download Resume</span>
      </a>
    </header>

    <!-- Embedded PDF Container -->
    <main class="w-full max-w-6xl flex-1 flex flex-col items-center justify-center">
      <div class="w-full h-[82vh] rounded-2xl border border-white/10 overflow-hidden shadow-2xl bg-white/5 relative">
        <object data="/resume.pdf" type="application/pdf" class="w-full h-full">
          <iframe src="/resume.pdf" class="w-full h-full border-none">
            <p class="p-8 text-center text-white/70">
              Your browser does not support PDF embedding. 
              <a href="/resume.pdf" download="Chetan_Shabadi_Resume.pdf" class="text-cyan-400 underline">Click here to download the resume PDF</a>.
            </p>
          </iframe>
        </object>
      </div>
    </main>
  </body>
</html>
